name: Verify Nintendo Life game search
on: [pull_request]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fLsS 'https://www.nintendolife.com/games/nintendo-switch/1-2-switch' -o /tmp/first.html &
          curl -fLsS 'https://www.nintendolife.com/games/switch-eshop/mysims_cozy_bundle' -o /tmp/second.html &
          curl -fLsS 'https://www.nintendolife.com/search?q=MySims%20Cozy%20Bundle' -o /tmp/search.html &
          curl -fLsS 'https://www.nintendolife.com/search?q=1-2-Switch' -o /tmp/search2.html &
          wait
          python3 - <<'PY'
          import pathlib, re
          for p in pathlib.Path('/tmp').glob('*.html'):
              s=p.read_text()
              print(p.name)
              for a in re.findall(r'<h1\b[^>]*>.*?</h1>',s,re.S): print('HEADING',a[:500])
              for a in re.findall(r'<(?:meta|link)\b[^>]*(?:canonical|og:title)[^>]+>',s): print('META',a[:500])
              if 'search' in p.name:
                  for a in re.findall(r'<a\b[^>]*href="[^"]*(?:1-2-switch|mysims_cozy_bundle)[^"]*"[^>]*>.*?</a>',s,re.S):
                      print('SEARCH',a[:500])
          PY
