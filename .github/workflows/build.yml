name: Build NXLoad
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: NXLoad
          path: NXLoad.nro
          if-no-files-found: error
