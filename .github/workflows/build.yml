name: Check alternate Nintendo storefront
on: [pull_request]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          curl -4 -fLsS --http1.1 --compressed --cacert romfs/cacert.pem 'https://www.nintendo.com/us/store/products/mysims-cozy-bundle-switch/' -o /tmp/my.html
          python3 - <<'PY'
          import json, pathlib, re
          from html.parser import HTMLParser
          s = pathlib.Path('/tmp/my.html').read_text()
          print('HTML size', len(s))
          for needle in ['__NEXT_DATA__','ProductGallery','screenshot','gameDescription', 'gallery', 'cozy bundle', 'mysims-cozy-bundle-switch', 'og:description']:
              matches = list(re.finditer(needle, s, re.I))
              print(needle, len(matches))
              for m in matches[:3]:
                  print(repr(s[max(0,m.start()-40):m.end()+65]))
          class Parser(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'meta' and a.get('property', '').startswith('og:'):
                      print(a)
                  if tag == 'img' and any(k in str(a).lower() for k in ('mysims', 'screenshot', 'gallery')):
                      print('img', {k:v for k,v in a.items() if k in ('src','alt','title')})
          Parser().feed(s)
          m = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', s, re.S)
          if m:
              def walk(obj, path):
                  if isinstance(obj, dict):
                      for k,v in obj.items():
                          if any(n in k.lower() for n in ('gallery','screenshot','description','producttitle')) and 'locales' not in path:
                              print(path + '/' + k, type(v).__name__, str(v)[:700])
                          walk(v, path + '/' + k)
                  if isinstance(obj, list):
                      for i,v in enumerate(obj[:12]): walk(v, path + '/' + str(i))
              walk(json.loads(m.group(1)), '')
          PY
