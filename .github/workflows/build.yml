name: Verify Nintendo catalog query
on: [pull_request]
permissions:
  contents: read
jobs:
  eshop-probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as et

          host = 'https://searching.nintendo-europe.com/en/select?'
          for args in (
              {'q':'mysims cozy bundle','fq':'type:GAME'},
              {'q':'MySims','fq':'type:GAME'},
              {'q':'Super Mario Odyssey','fq':'type:GAME'},
              {'q':'*','fq':'type:GAME AND fs_id:2640109'},
          ):
              args.update(rows=8, wt='xml')
              try:
                  with urllib.request.urlopen(host+urllib.parse.urlencode(args), timeout=12) as r:
                      data = r.read()
                  tree = et.fromstring(data)
                  results = tree.findall('.//result/doc')
                  print('Query:', args['q'], args['fq'], 'records:',len(results), 'root:',tree.tag)
                  if not results:
                      print(data[:360].decode())
                  for doc in results[:5]:
                      print({v.get('name'):''.join(v.itertext()).strip()[:185] for v in doc if v.get('name') in {'title','url','image_url','image_url_sq_s','excerpt','playable_on_txt','system_type','nsuid_txt','fs_id','publisher','date_from'}})
              except Exception as e:
                  print(type(e).__name__,str(e))
          PY
