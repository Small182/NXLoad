name: Build NXLoad
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Ensure libarchive and libmpv for Switch
        run: |
          if "${DEVKITPRO}/portlibs/switch/bin/aarch64-none-elf-pkg-config" --static --exists libarchive mpv; then
            echo "switch-libarchive and switch-libmpv are already installed"
          else
            for attempt in 1 2 3; do
              if dkp-pacman -Sy --needed --noconfirm switch-libarchive switch-libmpv; then exit 0; fi
              echo "Package mirror unavailable; retry $attempt"
              sleep 6
            done
            exit 1
          fi
      - name: Build curl and Mbed TLS for Switch
        run: bash tools/build-network.sh
      - name: Build libarchive with 7z codec support
        run: bash tools/build-archive.sh
      - run: make -j2
      - name: Check DLArchive TLS chain
        continue-on-error: true
        run: |
          status=0
          timeout 12s openssl s_client -connect direct-stor.berkasdrive.com:443 \
            -servername direct-stor.berkasdrive.com -tls1_2 -verify_hostname direct-stor.berkasdrive.com \
            -verify_return_error -CAfile romfs/cacert.pem -no-CApath -no-CAstore \
            < /dev/null > /tmp/nxload-tls-chain.txt 2>&1 || status=$?
          sed -n '/^depth=/p; /verify error/p; /Verify return code:/p' /tmp/nxload-tls-chain.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: NXLoad
          path: NXLoad.nro
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_name == 'native-1fichier' && startsWith(github.event.head_commit.message, 'Release NXLoad ')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check history for credentials before publishing
        run: |
          pattern='github_pat_[A-Za-z0-9_]{65,}|gh[pousr]_[A-Za-z0-9]{36,}|sk-(proj-|svcacct-)[A-Za-z0-9_-]{24,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          matches=$(git log --all --format=%h -G "$pattern")
          if [ -n "$matches" ]; then
            echo "::error::Potential credential material in Git history. Review before publishing."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: NXLoad
          path: release
      - name: Publish versioned NXLoad release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^APP_VERSION := //p' Makefile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release version in Makefile."
            exit 1
          fi
          tag="v$version"
          notes=".github/release-notes/$tag.md"
          test -s "$notes"
          gh release create "$tag" release/NXLoad.nro --target "$GITHUB_SHA" --title "NXLoad $version" --notes-file "$notes" --latest
