name: Check Ukrainian metadata and screenshots
on: [pull_request]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for file in UA.uk.json UA.en.json UA.ru.json US.uk.json; do curl -LsS -o /dev/null -w "$file: %{http_code}\n" "https://raw.githubusercontent.com/blawar/titledb/d424690446eec6f4484209b9a1c067c7f7511398/$file"; done
          curl -fLsS 'https://raw.githubusercontent.com/blawar/titledb/d424690446eec6f4484209b9a1c067c7f7511398/US.en.json' -o /tmp/title.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/title.json'))
          for key in ('70010000000141', '70010000084815', '70010000068159'):
              r = d[key]
              print(r['name'], repr(r.get('screenshots'))[:1200])
          print('Games with screenshots:', sum(bool(r.get('screenshots')) if isinstance(r,dict) else False for r in d.values()))
          PY
