name: Build NXLoad
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install libarchive for Switch
        run: dkp-pacman -Sy --needed --noconfirm switch-libarchive
      - name: Build curl and Mbed TLS for Switch
        run: bash tools/build-network.sh
      - run: make -j2
      - name: Check DLArchive TLS chain
        continue-on-error: true
        run: |
          status=0
          timeout 12s openssl s_client -connect direct-stor.berkasdrive.com:443 \
            -servername direct-stor.berkasdrive.com -tls1_2 -verify_hostname direct-stor.berkasdrive.com \
            -verify_return_error -CAfile romfs/cacert.pem -no-CApath -no-CAstore \
            < /dev/null > /tmp/nxload-tls-chain.txt 2>&1 || status=$?
          sed -n '/^depth=/p; /verify error/p; /Verify return code:/p' /tmp/nxload-tls-chain.txt
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: NXLoad
          path: NXLoad.nro
          if-no-files-found: error

  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ROMsHQ markers and RAR extraction
        run: |
          if ! pkg-config --exists libarchive libcurl libxml-2.0; then
            sudo apt-get update
            sudo apt-get install -y libarchive-dev libcurl4-openssl-dev libxml2-dev
          fi
          cat > /tmp/nxload-smoke.c <<'C'
          #include "catalog.c"
          #include "fichier.c"
          #include <assert.h>
          static htmlDocPtr html(const char *data) {
              return htmlReadMemory(data, strlen(data), NULL, "UTF-8", HTML_PARSE_NONET | HTML_PARSE_NOERROR);
          }
          int main(int argc, char **argv) {
              char target[URL_CAPACITY];
              const char *reply = "{\"success\":true,\"mode\":\"direct\",\"download_url\":"
                                  "\"https://romshq.com/d/synthetic-token/synthetic-signature\"}";
              assert(read_romshq_reply(reply,target) && strstr(target, "/d/synthetic-token/"));
              assert(!read_romshq_reply("{\"success\":true,\"mode\":\"direct\",\"download_url\":"
                                        "\"https://unrelated.example/d/id\"}", target));
              htmlDocPtr doc = html("<main>"
                  "<article><a href='/game/game-one'><h3>Switch title</h3></a><span>Switch</span></article>"
                  "<a href='/game/game-two'><h3>Another title</h3><span>Nintendo Switch 2</span></a>"
                  "<a href='/game/game-three'><h3>PS5 title</h3><span>PlayStation 5</span></a>"
                  "</main>");
              Game games[8] = {{0}};
              size_t count = 0;
              read_catalog(xmlDocGetRootElement(doc), games, &count, CATALOG_ROMSHQ);
              assert(count == 1 && strstr(games[0].page,"/game/game-one"));
              xmlFreeDoc(doc);
              doc = html("<section id='download'><h2>Download Links</h2>"
                  "<div><span>Base Game</span><a data-romshq-download='' data-video-id='1133' href='https://datanodes.to/demo/base.rar'>Download</a></div>"
                  "<div><span>Update</span><a data-romshq-download='' data-video-id='1134' href='https://datanodes.to/demo/update.rar'>Download</a></div></section>"
                  "<section id='screenshots'><img src='/images/sample.jpg'></section>");
              xmlNodePtr root = xmlDocGetRootElement(doc);
              GameDetails details = {0};
              read_romshq_files(romshq_section(root,"Download Links","download")->children,&details);
              read_romshq_screenshots(romshq_section(root,"Screenshots","screenshots")->children,&details);
              assert(details.count==2 && details.files[0].source==FILE_ROMSHQ_SIGNED && !strcmp(details.files[0].id,"1133"));
              assert(!strcmp(details.files[0].title,"Базова гра") && !strcmp(details.files[1].title,"Оновлення"));
              assert(details.screenshot_count==1 && !strcmp(details.screenshots[0],"https://romshq.com/images/sample.jpg"));
              xmlFreeDoc(doc);
              assert(argc==4 && rar_signature(argv[1]) && rar_signature(argv[2]));
              FichierJob job = {0};
              const char *message = unpack_rar(&job, argv[1], argv[3]);
              puts(message);
              assert(strstr(message,"готові") && atomic_load(&job.received)==11);
              message = unpack_rar(&job, argv[2], argv[3]);
              puts(message);
              assert(strstr(message,"Неприпустимий"));
              atomic_store(&job.cancelled,true);
              assert(strstr(unpack_rar(&job,argv[1],argv[3]), "скасовано"));
              puts("ROMsHQ markers, platform exclusion, gallery, signed response, RAR and traversal rejection passed");
          }
          C
          python3 - <<'PY'
          from pathlib import Path
          from struct import pack
          from zlib import crc32
          def header(typ, flags, extra=b''):
              data=pack('<BHH',typ,flags,7+len(extra))+extra
              return pack('<H', crc32(data)&65535)+data
          def archive(filename, outfile):
              payload=b'PFS0fixture'
              path=filename.encode()
              entry=pack('<IIBIIBBHI',len(payload),len(payload),3,crc32(payload),0,20,0x30,len(path),0o100644)+path
              data=b'Rar!\x1a\x07\x00'+header(0x73,0,b'\0'*6)+header(0x74,0x8000,entry)+payload+header(0x7b,0)
              Path(outfile).write_bytes(data)
          archive('folder/game.nsp','/tmp/safe.rar')
          archive('../escape.nsp','/tmp/unsafe.rar')
          PY
          mkdir /tmp/extracted
          cc -std=gnu11 -Wall -Wextra -Werror -Wno-missing-braces -I source /tmp/nxload-smoke.c source/unpack.c source/range.c $(pkg-config --cflags --libs libarchive libcurl libxml-2.0) -pthread -o /tmp/nxload-smoke
          /tmp/nxload-smoke /tmp/safe.rar /tmp/unsafe.rar /tmp/extracted
          test "$(cat /tmp/extracted/game.nsp)" = PFS0fixture
          test "$(find /tmp/extracted -type f | wc -l)" -eq 1
