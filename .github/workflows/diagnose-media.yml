name: Diagnose media providers
on:
  push:
    branches: [fix/media-recovery-1.0.50]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect accessible HTML and gallery markers
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          urls=[
            "https://www.nintendolife.com/games/nintendo-switch/super_mario_odyssey",
            "https://www.nintendo.com/us/store/products/super-mario-odyssey-switch/",
            "https://romshq.com/"
          ]
          for url in urls:
            for agent in ["NXLoad/1.0.3", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"]:
              print("URL",url,"user_agent",agent[:18],flush=True)
              try:
                req=urllib.request.Request(url,headers={"User-Agent":agent})
                with urllib.request.urlopen(req,timeout=22) as resp:
                  data=resp.read(16*1024*1024)
                  print("HTTP",resp.status,"LEN",len(data),"type",resp.headers.get("content-type"),"end",resp.url,flush=True)
                  for name,pat in [
                    ("old-nintendo-script",rb'<script id="__NEXT_DATA__"'),
                    ("switch-image-path",rb'store/software/switch/'),
                    ("video-path",rb'/Video/'),
                    ("video-resourcetype",rb'resourceType[^,}]{0,40}video'),
                    ("nl-gallery-section",rb'<section[^>]*id=["\']screenshots["\']'),
                    ("nl-gallery-image",rb'images\\.nintendolife\\.com/screenshots/[0-9]+/large\\.jpg'),
                    ("possible-nl-image",rb'screenshots/[0-9]+/'),
                    ("cloudflare",rb'Just a moment|Checking your browser|cf-chl')
                  ]:
                    print(name, len(re.findall(pat,data,re.I)),flush=True)
                  print("FIRST_100",repr(data[:100]),flush=True)
                  for marker in [b'id="screenshots"',b'screenshots/',b'productGallery',b'/Video/',b'store/software/switch/',b'"publicId"']:
                    p=data.find(marker)
                    if p>=0: print("SNIP",marker.decode(),repr(data[max(0,p-90):p+280])[:450],flush=True)
                  shots=re.findall(rb'<a\\b[^>]*href=[\\x22\\x27]([^\\x22\\x27]*screenshots/[^\\x22\\x27]+)',data,re.I)
                  print("NL_SCREEN_ANCHORS",len(shots),[x[:110].decode(errors="replace") for x in shots[:3]],flush=True)
                  videos=re.findall(rb'[^\\x22\\x27 <>]{0,120}/Video/[^\\x22\\x27 <>]{0,120}',data,re.I)
                  print("VIDEO_PATH_SAMPLES",[x[:200].decode(errors="replace") for x in videos[:3]],flush=True)
              except Exception as e: print("ERROR",type(e).__name__,str(e)[:200],flush=True)
          PY
