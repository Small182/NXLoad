name: Verify playable Switch video feeds
on:
  push:
    paths:
      - .github/workflows/playable-trailer-probe.yml
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect video streams and origins
        run: |
          python3 - <<'PY'
          import re,urllib.request,urllib.error,json
          urls={
            'gamereactor-hollow':'https://www.gamereactor.eu/video/383543/Hollow+Knight+-+Nintendo+Switch+Launch+Trailer/',
            'gamereactor-mario':'https://www.gamereactor.eu/video/340253/Super+Mario+Odyssey+-+Overview+Trailer/',
            'gamereactor-zelda':'https://www.gamereactor.eu/video/643033/The+Legend+of+Zelda+Tears+of+the+Kingdom+-+Rediscover+your+sense+of+adventure/',
            'gamereactor-embed':'https://www.gamereactor.eu/grtv/embed/383543',
            'ign-mario-search':'https://www.ign.com/videos/super-mario-odyssey-official-trailer',
            'ign-api':'https://apis.ign.com/video/v3/videos/383543',
            'rawg-no-key':'https://api.rawg.io/api/games/the-legend-of-zelda-tears-of-the-kingdom/movies',
          }
          for k,url in urls.items():
            print('\\n===',k,url,flush=True)
            try:
              rq=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36','Accept':'text/html,application/json,*/*;q=0.8'})
              with urllib.request.urlopen(rq,timeout=9) as r:
                body=r.read(1250000);ct=r.headers.get('content-type')
                print('HTTP',r.status,'CONTENT_TYPE',ct,'BYTES',len(body),'FINAL',r.url,flush=True)
              html=body.decode('utf-8','replace')
              if 'json' in (ct or ''):print('JSON',html[:1400],flush=True)
              else:
                print('TITLE',re.findall(r'<title[^>]*>(.{0,180}?)</title>',html,re.I|re.S)[:2],flush=True)
                for pattern in (r'https?[^"\\x27<>\\s]{8,400}\\.(?:mp4|m3u8|mpd)(?:\\?[^"\\x27<>\\s]{0,150})?',r'.{0,160}(?:<video|<source|videoplayer|videoPlayer|videosrc|video_src|video-source|videoAsset|video_url|videoURL|stream_url|playlist\\.m3u8|\\.mp4).{0,220}',r'.{0,100}(?:grtv|jwplayer|brightcove|gamereactor\\.eu/media|grtvplayer|embed).{0,120}'):
                  matches=re.findall(pattern,html,re.I)
                  print('PATTERN',pattern[:62],'COUNT',len(matches),'EXAMPLES',[m[:360] for m in matches[:11]],flush=True)
            except Exception as e:
              print('ERROR',type(e).__name__,str(e)[:230],flush=True)
          PY
      - name: Test HTTP Range and trailer discovery
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json
          urls=[
            "https://media.gamereactor.eu/default/t_HollowKnight_383543.mp4",
            "https://media.gamereactor.eu/default/t_SuperMarioOdyssey_340253.mp4",
            "https://media.gamereactor.eu/default/t_The_Legend_of_Zelda_Tears_of_the_Kingdom_Rediscover_your_sense_of_adventure_643033.mp4",
          ]
          for url in urls:
            print("== MEDIA ==",url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"Range":"bytes=0-15","User-Agent":"NXLoad/1.0.50"})
              with urllib.request.urlopen(req,timeout=12) as r:
                data=r.read(32)
                print("STATUS",r.status,"CONTENT",r.headers.get('Content-Type'),
                      "RANGE",r.headers.get('Content-Range'),
                      "LENGTH",r.headers.get('Content-Length'),
                      "MAGIC",data.hex(),"FTYP",data[4:8],flush=True)
            except Exception as e: print("ERROR",repr(e),flush=True)
          discovery={
            "wp-search":"https://www.gamereactor.eu/wp-json/wp/v2/search?search=Hollow%20Knight&per_page=25",
            "wp-search-video":"https://www.gamereactor.eu/wp-json/wp/v2/search?search=Hollow%20Knight&per_page=25&subtype=video",
            "wp-search-gr_video":"https://www.gamereactor.eu/wp-json/wp/v2/search?search=Hollow%20Knight&per_page=25&subtype=gr_video",
            "wp-grtv":"https://www.gamereactor.eu/wp-json/wp/v2/gr_video?search=Hollow%20Knight",
            "wp-video":"https://www.gamereactor.eu/wp-json/wp/v2/video?search=Hollow%20Knight",
            "site-search":"https://www.gamereactor.eu/video/?s=Hollow+Knight",
            "site-search2":"https://www.gamereactor.eu/video/?search=Hollow+Knight",
            "site-search3":"https://www.gamereactor.eu/video/?q=Hollow+Knight",
            "site-search4":"https://www.gamereactor.eu/video/?query=Hollow+Knight",
            "site-search5":"https://www.gamereactor.eu/?s=Hollow+Knight&post_type=gr_video",
            "site-search6":"https://www.gamereactor.eu/video/?s=Super+Mario+Odyssey",
          }
          for name,url in discovery.items():
            print("== SEARCH ==",name,url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36"})
              with urllib.request.urlopen(req,timeout=9) as r:
                data=r.read(550000);ctype=r.headers.get('content-type','');real=r.url
                print("HTTP",r.status,"CT",ctype,"BYTES",len(data),"FINAL",real,flush=True)
              v=data.decode('utf-8','replace')
              if 'json' in ctype:print("JSON",repr(v[:1800]),flush=True)
              else:
                print("TITLE",re.findall(r'<title[^>]*>([^<]+)',v,re.I)[:2],flush=True)
                print("VIDEOLINK",re.findall(r'<a[^>]*href=["\\x27]([^"\\x27]*(?:/video/|/grtv/)[^"\\x27]*)["\\x27][^>]*>',v,re.I)[:10],flush=True)
                for word in ['Hollow Knight - Nintendo Switch Launch Trailer','Hollow Knight','Super Mario Odyssey']:
                  print("HAS",word,word.lower() in v.lower(),flush=True)
                for tag in re.findall(r'<form[^>]*>.*?</form>',v,re.I|re.S)[:4]: print("FORM",re.sub(r'\\s+',' ',tag)[:550],flush=True)
            except Exception as e:print("ERROR",repr(e),flush=True)
          PY
